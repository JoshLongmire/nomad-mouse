[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_speed = 115200
; This module is a 16MB flash. 80MHz QIO fails in ROM (ets_loader.c 78)
; and the panel stays black. Build the DIO bootloader; the upload step
; forces 40MHz because this SDK has no 40MHz bootloader elf.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
lib_deps = moononournation/GFX Library for Arduino@1.4.9
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
